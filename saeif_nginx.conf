# /etc/nginx/sites-available/saeif
# SAEIF — saeif.terradigital.net
# TerraDigital · Pedro Pestana
#
# PASSO 1: usar este ficheiro para obter o certificado Let's Encrypt
# PASSO 2: após certbot, o ficheiro será actualizado automaticamente com o bloco HTTPS
#
# Instalação:
#   sudo cp saeif_nginx.conf /etc/nginx/sites-available/saeif
#   sudo ln -s /etc/nginx/sites-available/saeif /etc/nginx/sites-enabled/saeif
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d saeif.terradigital.net
#

server {
    listen 80;
    listen [::]:80;
    server_name saeif.terradigital.net;

    # Raiz para o desafio ACME do Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redireccionamento HTTP → HTTPS (activar após certbot)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # --- Proxy para a API FastAPI + frontend estático ---
    # (temporariamente em HTTP para validar antes do TLS)

    # WebSocket — necessário para /ws
    location /ws {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400;
    }

    # API REST e frontend estático
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_connect_timeout 60;
    }
}
