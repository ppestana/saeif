<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — SAEIF · TerraDigital</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400&display=swap');
    :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#c9d1d9;--dim:#8b949e;--fire:#f85149;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;
      min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
    .code{font-family:'IBM Plex Mono',monospace;font-size:96px;font-weight:600;
      color:var(--fire);line-height:1;margin-bottom:1rem;opacity:.8;}
    .title{font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--dim);
      text-transform:uppercase;letter-spacing:.1em;margin-bottom:2rem;}
    .msg{font-size:14px;color:var(--dim);text-align:center;max-width:360px;line-height:1.6;margin-bottom:2rem;}
    .btn{font-family:'IBM Plex Mono',monospace;font-size:12px;
      background:var(--panel);border:1px solid var(--border);color:var(--text);
      padding:.6rem 1.2rem;border-radius:2px;text-decoration:none;
      transition:border-color .15s;}
    .btn:hover{border-color:var(--fire);}
    .brand{position:fixed;top:1rem;left:1rem;font-family:'IBM Plex Mono',monospace;
      font-size:14px;font-weight:600;color:var(--fire);text-decoration:none;}
  </style>
</head>
<body>
  <a href="/" class="brand">SAEIF</a>
  <div class="code">404</div>
  <div class="title">Página não encontrada</div>
  <div class="msg">O recurso que procura não existe ou foi removido.</div>
  <a href="/" class="btn">← Voltar ao mapa</a>
</body>
</html>
